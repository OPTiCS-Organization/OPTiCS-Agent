name: Agent Image Builder

on:
  release:
    types: [published]

jobs:
  # 이미지 태그는 git 태그에서, release.json의 버전은 package.json에서 나온다.
  # 둘이 어긋나면 카탈로그에는 올라오는데 pull은 실패하는 버전이 생기고,
  # 나중에 같은 번호로 정식 릴리즈를 내면 그 행을 덮어써 프리릴리즈가 정식으로 둔갑한다.
  # 프리릴리즈에서 특히 밟기 쉬우므로(태그만 -rc를 붙이고 package.json은 그대로 두기 쉽다)
  # 이미지가 푸시되기 전인 여기서 막는다.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Verify Release Tag Matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '${TAG}' does not match package.json version '${VERSION}'."
            exit 1
          fi

          # 프로토콜이 없거나 숫자가 아니면 Hub가 release.json을 버린다. 그러면 워크플로는
          # 초록불인데 Console에는 이 버전이 영영 보이지 않는다. 조용히 사라지느니 여기서 죽는다.
          if ! jq -e '.optics.protocol | type == "number"' package.json > /dev/null; then
            echo "::error::package.json has no numeric optics.protocol."
            exit 1
          fi

          echo "Release ${TAG} matches package.json ${VERSION}."

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - name: Prepare Variables
        env:
          platform: ${{ matrix.platform }}
        run: |
          echo "SLUG=${platform//\//-}" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # 태그 없이 다이제스트만 푸시한다. 태그 부착은 merge 잡이 담당한다.
      - name: Build and Push by Digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.SLUG }}

      - name: Export Digest
        env:
          digest: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Prepare Image Name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Download Digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Create Manifest List
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect Manifest
        run: |
          docker buildx imagetools inspect \
            "$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  # 이미지 푸시가 성공한 뒤에만 붙인다.
  # 그래야 release.json의 존재 자체가 "이 버전의 이미지가 GHCR에 있다"는 영수증이 되고,
  # Hub 카탈로그는 이 자산이 붙은 릴리즈만 노출하면 설치 불가능한 버전을 권하지 않게 된다.
  publish-metadata:
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Publish Release Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          jq --arg image "$IMAGE" '{
            version: .version,
            protocol: .optics.protocol,
            image: $image
          }' package.json > release.json
          cat release.json
          gh release upload "$TAG" release.json --clobber
