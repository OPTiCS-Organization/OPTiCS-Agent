name: Agent Image Builder
on:
  release:
    types:
      - published
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 이미지 푸시가 성공한 뒤에만 붙인다.
      # 그래야 release.json의 존재 자체가 "이 버전의 이미지가 GHCR에 있다"는 영수증이 되고,
      # Hub 카탈로그는 이 자산이 붙은 릴리즈만 노출하면 설치 불가능한 버전을 권하지 않게 된다.
      - name: Publish Release Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # GHCR은 소문자만 받는다. metadata-action이 태그에 쓰는 이름과 같아야 하므로 동일하게 소문자화한다.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          jq --arg image "$IMAGE" '{
            version: .version,
            protocol: .optics.protocol,
            image: $image
          }' package.json > release.json
          cat release.json
          gh release upload "$TAG" release.json --clobber
