# 프로젝트 이름 고정
name: optics-agent

services:
  optics-agent:
    # 사용자가 고정한 버전이 입력되는 유일한 곳
    image: ghcr.io/optics-organization/optics-agent:${AGENT_IMAGE_TAG:-latest}
    ports:
      - "${AGENT_PORT:-5230}:5230"
    volumes:
      - "optics-data:/app/data"
      - "optics-build:/app/dist/build"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - type: bind
        source: "${HOST_SSH_PRIVATE_KEY_FILE:-/dev/null}"
        target: /run/secrets/host_ssh_key
        read_only: true
    networks:
      - service-network
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  optics-agent-dashboard:
    image: ghcr.io/optics-organization/optics-agent-dashboard:${DASHBOARD_IMAGE_TAG:-latest}
    ports:
      - "${DASHBOARD_PORT:-5240}:80"
    networks:
      - service-network

networks:
  service-network: {}

volumes:
  optics-data: {}
  optics-build:
    name: optics-build
